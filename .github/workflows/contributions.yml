name: Contributions banner
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths: [contrib.py, .github/workflows/contributions.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 contrib.py > contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          git diff --cached --quiet || { git commit -m "Update contributions banner" && git push; }
