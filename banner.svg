<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="elosainta — Full-stack developer, computer science student, application security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0710"/>
      <stop offset="0.55" stop-color="#1f0b1c"/>
      <stop offset="1" stop-color="#3d0f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ff3d81" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3d81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#ff4f8b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff6fa3" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .node { animation: pulse 3.2s ease-in-out infinite; }
      .n2 { animation-delay: 1.1s; } .n3 { animation-delay: 2.2s; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- network motif, right side -->
    <g stroke="#ff4f8b" stroke-opacity="0.35" stroke-width="1" fill="none">
      <path d="M860 80 L980 140 L1100 90 M980 140 L960 240 L1080 220 L1100 90 M860 80 L840 200 L960 240"/>
      <circle cx="980" cy="140" r="58" stroke-opacity="0.12"/>
      <circle cx="980" cy="140" r="104" stroke-opacity="0.07"/>
    </g>
    <g fill="#ffb35c">
      <circle class="node" cx="860" cy="80" r="3.5"/>
      <circle class="node n2" cx="980" cy="140" r="5"/>
      <circle class="node n3" cx="1100" cy="90" r="3.5"/>
      <circle class="node n2" cx="840" cy="200" r="3"/>
      <circle class="node" cx="960" cy="240" r="4"/>
      <circle class="node n3" cx="1080" cy="220" r="3"/>
    </g>

    <!-- frame ticks -->
    <g stroke="#ff4f8b" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <path d="M28 44V28H44M1156 28H1172V44M1172 276V292H1156M44 292H28V276"/>
    </g>

    <text x="72" y="78" class="mono" font-size="13" letter-spacing="3" fill="#ffb35c">PORTFOLIO · ENGINEERING</text>

    <text x="70" y="158" class="sans" font-size="72" font-weight="600" letter-spacing="-1.5" fill="#fff4ec">elosainta</text>
    <rect x="72" y="180" width="360" height="2" fill="url(#rule)"/>

    <text x="72" y="216" class="sans" font-size="21" fill="#d6f5f2">Full-Stack Developer <tspan fill="#ff4f8b">·</tspan> Computer Science Student <tspan fill="#ff4f8b">·</tspan> Application Security</text>

    <text x="72" y="262" class="mono" font-size="15" fill="#a9cfcb"><tspan fill="#ffb35c">$</tspan> shipping secure, reliable software end to end<tspan class="cursor" fill="#ffb35c"> ▍</tspan></text>

    <text x="1128" y="282" class="mono" font-size="12" letter-spacing="2" fill="#a8708f" text-anchor="end">LARAVEL / PYTHON / DOCKER</text>
  </g>
</svg>
